rules:
  - id: dvwa-reflected-xss
    message: Untrusted GET input is written directly into HTML output
    severity: ERROR
    languages:
      - php
    mode: taint
    pattern-sources:
      - pattern: $_GET[...]
    pattern-sanitizers:
      - pattern: htmlspecialchars(...)
    pattern-sinks:
      - pattern: $html .= $DATA
